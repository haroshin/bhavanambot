services:
  - type: worker
    name: bhavanam-telegram-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TARGET_CHAT_ID
        sync: false
      - key: ENABLE_SCHEDULED_REMINDERS
        value: "true"
      - key: TRASH_SCHEDULE_CRON
        value: "0 20 * * *"
      - key: TZ
        value: "Asia/Kolkata"
